# properties.yaml — the property catalogue for the CRM Report Card.
#
# Three kinds of properties, matching how the intake maps fields (SKILL.md
# step 3). This file is a human reference; the runtime source of truth for the
# default-mapped names is _ROLE_ALIASES in
# scripts/crm_report_card/field_mapping.py (kept stdlib-only, no yaml at runtime).

# 1) DEFAULT-MAPPED
#    Well-known default property names we map, by EXACT name, to the role a check
#    uses. auto_map() does this conservatively: exact match only, so it never
#    mis-guesses, and a role with no exact match is simply left unmapped.
default_mapped:
  company_name: [Company name, Company, Account name, Organization]
  domain:       [Company Domain Name, Domain, Website URL, Website]
  company_size: [Number of Employees, Employees, Employee count, Headcount]
  last_activity: [Last Activity Date, Last Modified Date, Last Engagement Date]
  contact_name: [Contact name, Full name]
  email:        [Email, Email address, Work email]

# 2) ENRICHMENT (default concepts we do NOT map from a column, because a static
#    export cannot contain them). Verified in the paid tier, shown as locked
#    rows. Never faked in the free scan.
enrichment_not_mapped:
  verified_employee_count:
    note: True current headcount and band accuracy, not just whether size is filled.
  still_employed_job_change:
    note: Whether a contact still works at the on-record company.
  email_deliverability:
    note: Whether an address actually accepts mail.

# 3) CUSTOM
#    Any other column the user says matters. Added by exact header to
#    critical_properties; the fill-rate FACT then covers it. This is how a user
#    brings their own properties into the grade.
custom:
  examples: [Industry, Company owner, Lifecycle stage, Annual revenue]
  note: Ask which other columns are critical, then add them by exact header.

# Free deterministic checks (each produces a FACT row):
#   duplicates_exact, duplicates_fuzzy, fill_rate, contradiction_size_vs_contacts,
#   junk_free_mail, junk_generic_inbox, junk_test_records, staleness,
#   dead_domain_liveness
