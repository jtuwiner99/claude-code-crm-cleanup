# properties.yaml: property catalogue for the CRM Report Card.
#
# Seeded from Sculpted's default property catalog for companies and contacts:
# the standard properties we map to and get by default. This file is a human
# reference for the intake (SKILL.md step 3). The runtime source of truth for
# the column-matching aliases is _ROLE_ALIASES in
# scripts/crm_report_card/field_mapping.py (stdlib-only, no yaml at runtime).
#
# "source" tells you what the FREE read-only audit can do with each property:
#   read    = read it straight from their CSV export (deterministic, free)
#   enrich  = produced or verified from a live provider (the paid layer); the
#             free audit can only check fill-rate on a column they already have
# Writing a value back into their CRM, or creating a new property for it, is the
# paid enrichment engagement. The free audit reads and reports only.

company_defaults:
  domain:               { source: read,          role: domain,        hubspot: domain }
  company_name:         { source: read,          role: company_name,  hubspot: name }
  hubspot_record_id:    { source: read,          role: record_id,     hubspot: hs_object_id }
  employee_count:       { source: read+enrich,   role: company_size,  hubspot: numberofemployees,
                          note: "Free tier reads the stored value and checks it is present and consistent. The true current headcount and band accuracy are enrichment." }
  industry:             { source: enrich,         hubspot: industry }
  linkedin_company_url: { source: enrich,         hubspot: linkedin_company_page }
  hq_location:          { source: enrich,         hubspot: "address / city / state / zip / country" }

# Contacts map PERSON properties only. A contact does not carry the company's
# headcount: HubSpot's contact-level "Company size" was 0.2% filled on a real
# 848-record book, so mapping it graded a company property on the wrong object.
# `company_size` is therefore company-only (see _OBJECT_EXCLUDED_ROLES).
contact_defaults:
  first_name:   { source: read,   role: contact_name, hubspot: firstname }
  last_name:    { source: read,   role: contact_name, hubspot: lastname }
  company_name: { source: read,   hubspot: company,
                  note: "Denormalized text field, often blank even on a properly associated contact. Used only as a label and as the orphan fallback when the export has no association column." }
  associated_company_id: { source: read, role: associated_company_id, hubspot: associatedcompanyid,
                  note: "The REAL contact->company link. What the orphaned check grades. Grading on company_name instead reported 41.2% orphaned where the truth was 10.0%." }
  email_domain: { source: read,   role: domain, hubspot: hs_email_domain,
                  note: "The contact's domain role. 97.3% filled vs 20.8% for the contact-level Website URL, which is that person's own site and is never mapped here. If absent, the loader derives it from the email address." }
  email:        { source: read,   role: email, hubspot: email }
  phone:        { source: read,   hubspot: phone }
  job_title:    { source: enrich, hubspot: jobtitle }
  linkedin_url: { source: enrich, hubspot: hs_linkedin_url }
  persona:      { source: enrich, hubspot: hs_persona }
  seniority:    { source: enrich, hubspot: hs_seniority }

# Information we produce every run regardless, whether or not their CRM has a
# field for it. On the card these appear as results; wiring them back into their
# CRM (mapping to an existing property or creating a new one) is the paid tier.
always_run_derived:
  domain_liveness:            { free: true,  note: "Live / bot-blocked / dead. Deterministic HTTP check. Already in the free scan." }
  still_employed_job_change:  { free: false, note: "The comparison is deterministic, but it needs a live profile scrape as input. At cost." }
  email_deliverability:       { free: false, note: "Whether the mailbox actually accepts mail. Enrichment. At cost." }
  verified_employee_count:    { free: false, note: "True current headcount and band accuracy. Enrichment. At cost." }

# Classification the engagement builds per business. Not shipped free, because it
# needs definitions, custom logic, and QA before it is trustworthy to act on.
# If a stored column for one exists in the export, its fill-rate can be graded
# free; the per-record classification itself is the done-for-you work.
custom_classification_examples:
  - company_type            # segment of company (Enterprise / Mid-Market / SMB, etc.)
  - b2b_or_not              # does the account fit a B2B GTM motion
  - vertical                # industry vertical / segment
  - icp_fit_score           # per-record fit against the ICP

# The check roles the free deterministic scan actually uses (auto-mapped from the
# HubSpot default column labels above; see _ROLE_ALIASES in field_mapping.py).
# Mapping is object-aware, so the role set differs:
#   companies: company_name, domain, company_size, last_activity, record_id
#   contacts:  contact_name (first/last), email, domain (= email domain),
#              company_name, associated_company_id, last_activity, record_id
# Any OTHER column the user says matters (Industry, Company owner, a custom
# field) is added by exact header to critical_properties and gets fill-rate too.
