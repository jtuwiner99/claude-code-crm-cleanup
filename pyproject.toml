[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-report-card"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "scripts"}
packages = ["crm_report_card", "crm_report_card.checks"]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
