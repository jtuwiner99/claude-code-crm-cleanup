<!-- assets/scorecard-template.html -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>$product_name</title>
<style>
  :root { --ink:#141414; --muted:#6b6b6b; --line:#e6e6e2; --coral:#ff5c39; --bg:#faf9f6; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:760px; margin:0 auto; padding:40px 24px; }
  .grade { font-size:120px; font-weight:800; line-height:1; color:var(--coral); }
  .row { display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .tag { font:600 11px/1 ui-monospace,Menlo,monospace; letter-spacing:.04em; padding:3px 6px; border-radius:4px; }
  .fact { background:#eef3ee; color:#2e6b3e; } .estimate { background:#fff0eb; color:var(--coral); }
  .locked { color:var(--muted); } .cta { display:inline-block; margin-top:12px; padding:14px 22px;
    background:var(--coral); color:#fff; text-decoration:none; font-weight:700; border-radius:8px; }
  h1 { font-size:22px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
</style></head>
<body><div class="wrap">
  <p class="sub">$product_name</p>
  <div class="grade">$overall_grade</div>
  <h1>Overall grade: $overall_grade</h1>
  <p class="sub">$record_count records scanned</p>
  $fact_rows
  $estimate_block
  <h2>Unlock the rest</h2>
  $locked_block
  <a class="cta" href="$mailto">Work with Jacob</a>
  <p class="sub"><a href="$booking_url">Book a call</a></p>
</div></body></html>
